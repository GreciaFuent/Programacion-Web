name: Test Doppler Secrets

on:
  workflow_dispatch:

jobs:
  print-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show AWS Region (sanity check)
        run: echo "AWS Region: ${{ secrets.AWS_REGION }}"

      - name: Show S3 Bucket
        run: echo "S3 Bucket: ${{ secrets.S3_BUCKET_NAME }}"
