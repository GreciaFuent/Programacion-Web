<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea_02</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <h2 class="title">¿Quién eres? Elige tu perfil</h2>
        <div class="users">
            <ul class="list_user">
                <li class="user">
                    <a href="#"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/disp/1bdc9a33850498.56ba69ac2ba5b.png" alt="user profile"></a>
                    <p>Pedro</p>
                </li>
                <li class="user">
                    <a href="#"><img src="https://loodibee.com/wp-content/uploads/Netflix-avatar-5.png" alt="user profile"></a>
                    <p>Fer</p>
                </li>
                <li class="user">
                    <a href="#"><img src="https://loodibee.com/wp-content/uploads/Netflix-avatar-2.png" alt="user profile"></a>
                    <p>Andrea</p>
                </li>
            </ul>
            <button class="add_profile"><svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 512 512" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M416 277.333H277.333V416h-42.666V277.333H96v-42.666h138.667V96h42.666v138.667H416v42.666z"></path></svg></button>
        </div>
        
        <button class="manage_profile">Administrar Perfiles</button>
    </section>
</body>
</html>
